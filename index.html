<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mix Snapshots</title>
  <style>
    :root { color-scheme: dark; --accent: #3FC1B0; --b: #E8B93C; --bg: #17181A; --panel: #212226; --line: #2E3035; --text: #DDDEE0; --dim: #8A8C92; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 13px -apple-system, Helvetica, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    header { display: flex; align-items: baseline; gap: 8px; padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
    header h1 { font-size: 13px; font-weight: 600; margin: 0; cursor: default; }
    #build { font: 10px Menlo, monospace; color: #5F6167; }
    #status { margin-left: auto; color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
    section { padding: 10px 12px; border-bottom: 1px solid var(--line); }
    h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--dim); margin: 0 0 6px; display: flex; align-items: center; }
    h2 .right { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
    button { font: inherit; background: #2B2D32; color: var(--text); border: 1px solid #3A3C42; border-radius: 6px; cursor: pointer; }
    button:hover:not(:disabled) { background: #34363C; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #0D1514; font-weight: 600; }
    button.primary:hover:not(:disabled) { background: #5DD3C3; }
    input[type=text] { font: inherit; background: #111214; border: 1px solid #3A3C42; color: var(--text); border-radius: 6px; padding: 0 8px; min-width: 0; }
    input[type=text]:focus { outline: none; border-color: var(--accent); }
    .save { display: flex; gap: 6px; }
    .save input { flex: 1; height: 30px; }
    .save button { height: 30px; padding: 0 14px; }

    .ab { display: flex; gap: 6px; align-items: stretch; }
    .ab .side { flex: 1; height: 52px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 0 10px; text-align: left; overflow: hidden; }
    .ab .side b { font: 600 15px -apple-system, Helvetica; }
    .ab .side span { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .ab #sideA b { color: var(--accent); }
    .ab #sideB b { color: var(--b); }
    .ab .side.on { border-color: currentColor; }
    .ab #sideA.on { background: rgba(63, 193, 176, 0.14); border-color: var(--accent); }
    .ab #sideB.on { background: rgba(232, 185, 60, 0.14); border-color: var(--b); }
    .ab #flip { width: 40px; font-size: 16px; }
    .hint { color: #5F6167; font-size: 11px; margin-top: 6px; }

    #list { flex: 1; overflow: auto; padding: 4px 0; }
    .snap { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-bottom: 1px solid #222428; }
    .snap.last { background: #1D2423; }
    .snap .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; }
    .snap.last .name::before { content: '● '; color: var(--accent); font-size: 9px; vertical-align: 2px; }
    .snap .when { color: #5F6167; font: 10px Menlo, monospace; }
    .snap input { flex: 1; height: 24px; }
    .snap button { height: 24px; font-size: 12px; padding: 0 7px; }
    .snap .chip { width: 24px; padding: 0; font-weight: 600; color: var(--dim); }
    .snap .chip.a.on { background: var(--accent); border-color: var(--accent); color: #0D1514; }
    .snap .chip.b.on { background: var(--b); border-color: var(--b); color: #151209; }
    .snap .icon { width: 24px; padding: 0; color: var(--dim); }
    .empty { color: var(--dim); padding: 14px 12px; line-height: 1.5; }

    .ticks { display: flex; flex-wrap: wrap; gap: 4px 12px; }
    .ticks label { display: flex; align-items: center; gap: 5px; color: var(--dim); cursor: pointer; }
    .ticks input { margin: 0; accent-color: var(--accent); }
    .ticks label.auto { color: var(--text); }
    #message { min-height: 16px; font-size: 12px; color: var(--dim); padding: 8px 12px 10px; line-height: 1.4; }
    #message.warn { color: #F2A33A; }
    #message.ok { color: var(--accent); }
  </style>
</head>
<body>
  <header><h1 id="title" title="Double-click to reload">Mix Snapshots</h1><span id="build"></span><div id="status">connecting...</div></header>
  <section>
    <div class="save">
      <input type="text" id="name" placeholder="Snapshot name" maxlength="60">
      <button id="save" class="primary" title="Save the whole mix as it is now (Return)">Save</button>
    </div>
  </section>
  <section>
    <div class="ab">
      <button class="side" id="sideA" title="Recall snapshot A (A key)"><b>A</b><span>not set</span></button>
      <button id="flip" title="Flip between A and B (Tab)">&#x21C4;</button>
      <button class="side" id="sideB" title="Recall snapshot B (B key)"><b>B</b><span>not set</span></button>
    </div>
    <div class="hint">Set A and B with the chips below. Flipping keeps one undo step.</div>
  </section>
  <section style="padding:8px 12px 2px;border-bottom:0"><h2>Snapshots <span class="right" id="count"></span></h2></section>
  <div id="list"></div>
  <section style="border-top:1px solid var(--line);border-bottom:0">
    <h2>Recall</h2>
    <div class="ticks" id="ticks">
      <label><input type="checkbox" data-k="levels"> Levels</label>
      <label><input type="checkbox" data-k="pans"> Pans</label>
      <label><input type="checkbox" data-k="mutes"> Mutes</label>
      <label><input type="checkbox" data-k="sends"> Sends</label>
      <label><input type="checkbox" data-k="plugins"> Plug-ins</label>
      <label class="auto" title="Ticked: automation lines and Read/Off modes come back too. Unticked: your current automation stays as it is."><input type="checkbox" data-k="automation"> + their automation</label>
    </div>
  </section>
  <div id="message"></div>
  <script src="vendor/luna.global.js"></script>
  <script src="logic.js"></script>
  <script src="main.js"></script>
</body>
</html>
